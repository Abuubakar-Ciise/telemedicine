plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}
android {
    namespace = "com.example.telemedicine"
    // compileSdk = flutter.compileSdkVersion
    // compileSdk = 35
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.telemedicine"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk = flutter.minSdkVersion
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [appLabel: "Tayo"]
        // manifestPlaceholders["SHOREBIRD_DISABLE_UPDATES"] = "true"

    }

    // Compress native libraries inside the APK (much smaller file to download/share)
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Zego ZIM (in-app chat/signaling, 14 MB) is not used: calls ring via Firebase
            // and run on the Zego Express engine. Leaving it out saves ~14 MB installed.
            excludes += ["**/libZIM.so"]
        }
    }

    buildTypes {
        debug {
            // Debug builds install next to the release app: com.example.telemedicine.dev / "Tayo Dev"
            applicationIdSuffix ".dev"
            manifestPlaceholders += [appLabel: "Tayo Dev"]
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // Shrink unused code/resources (keep rules for Zego & CallKit are in proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // ✅ Import the Firebase BoM (Bill of Materials)
    implementation platform('com.google.firebase:firebase-bom:35.1.0')

    // ✅ Add Firebase SDKs (only Analytics added here, add more if needed)
    implementation 'com.google.firebase:firebase-analytics'

    // ✅ Add other Firebase services here (optional):
    // implementation 'com.google.firebase:firebase-auth'
    // implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
}

flutter {
    source = "../.."
}
